name: Discord race thread safety tests
on:
  pull_request:
    paths:
      - 'app/api/cron/discord-race-threads/route.js'
      - 'tests/discord-race-*'
      - 'scripts/discord-race-readonly-diagnostic.mjs'
      - 'supabase/migrations/*discord_race_thread*'
      - '.github/workflows/discord-race-thread-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mocked-route-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mocked state and route tests
        run: node --test tests/discord-race-delivery-state.test.mjs tests/discord-race-route.integration.test.mjs tests/discord-race-readonly-diagnostic.test.mjs

  isolated-postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated database concurrency and grants checks
        run: bash tests/discord-race-postgres-integration.sh
