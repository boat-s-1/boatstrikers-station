name: Patch course cards
on:
  push:
    paths:
      - '.github/patch-course-cards-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch races page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/races/page.js')
          s = p.read_text(encoding='utf-8')
          old_import = 'import RealtimeUpdates from "../components/RealtimeUpdates";\n'
          new_import = old_import + 'import CoursePortalCard from "./components/CoursePortalCard";\n'
          if 'CoursePortalCard' not in s:
              if old_import not in s:
                  raise SystemExit('import anchor not found')
              s = s.replace(old_import, new_import, 1)

          old = '''                const status = getCourseStatus(course, raceDate);\n                const noteCount = noteCountByCourse.get(numericCode) ?? 0;\n                const isNight = NIGHT_COURSE_CODES.has(numericCode);\n                const background = COURSE_BACKGROUNDS[numericCode] ?? "/IMG_6460.jpeg";\n                return (\n                  <Link\n                    key={numericCode}\n                    href={`/races/${code}?date=${raceDate}`}\n                    className={styles.compactCourseCard}\n                    style={{ backgroundImage: `linear-gradient(180deg,rgba(2,12,32,.10),rgba(2,14,38,.88)),url("${background}")` }}\n                  >\n                    <div className={styles.compactCourseTop}>\n                      <span>#{code}</span>\n                      <b className={styles[`courseStatus_${status.key}`]}>{status.label}</b>\n                    </div>\n                    <div className={styles.compactCourseBottom}>\n                      <div><h3>{course.courseName}</h3><p>{status.detail}</p></div>\n                      <div className={styles.compactCourseBadges}>\n                        {isNight && <span>🌙</span>}\n                        {noteCount > 0 && <strong>📰 {noteCount}件</strong>}\n                      </div>\n                    </div>\n                  </Link>\n                );'''
          new = '''                const noteCount = noteCountByCourse.get(numericCode) ?? 0;\n                const background = COURSE_BACKGROUNDS[numericCode] ?? "/IMG_6460.jpeg";\n                return (\n                  <CoursePortalCard\n                    key={numericCode}\n                    course={course}\n                    raceDate={raceDate}\n                    background={background}\n                    noteCount={noteCount}\n                  />\n                );'''
          if old not in s:
              raise SystemExit('course card block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time workflow and trigger
        run: |
          rm -f .github/workflows/patch-course-cards.yml .github/patch-course-cards-trigger
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(races): launch smart course cards"
          git push
