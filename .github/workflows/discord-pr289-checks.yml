name: Discord PR 289 checks
on:
  push:
    branches:
      - fix/discord-webhook-delivery-integrity
  pull_request:
    paths:
      - 'app/api/cron/discord-alerts/route.js'
      - 'app/lib/discordAlertDelivery.js'
      - 'tests/**'
      - '.github/workflows/discord-pr289-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Discord delivery regression tests
        run: node --test tests/discord-alert-delivery.test.mjs
      - name: Related Discord tests
        run: |
          for f in tests/*discord*.test.mjs; do
            [ "$f" = "tests/discord-alert-delivery.test.mjs" ] && continue
            node --test "$f"
          done
      - name: Next.js build with non-production Firebase CI placeholders
        env:
          NEXT_PUBLIC_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder-anon-key'
          NEXT_PUBLIC_FIREBASE_API_KEY: 'AIzaSyCIPlaceholder000000000000000000000'
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'ci-placeholder.firebaseapp.com'
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'ci-placeholder'
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'ci-placeholder.appspot.com'
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789012'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:123456789012:web:0123456789abcdef012345'
        run: npm run build
