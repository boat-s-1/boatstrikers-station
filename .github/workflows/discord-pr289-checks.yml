name: Discord PR 289 checks
on:
  push:
    branches:
      - fix/discord-webhook-delivery-integrity
  pull_request:
    paths:
      - 'app/api/cron/discord-alerts/route.js'
      - 'app/lib/discordAlertDelivery.js'
      - 'tests/**'
      - '.github/workflows/discord-pr289-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Discord delivery regression tests
        run: node --test tests/discord-alert-delivery.test.mjs
      - name: Related Discord tests
        run: |
          for f in tests/*discord*.test.mjs; do
            [ "$f" = "tests/discord-alert-delivery.test.mjs" ] && continue
            node --test "$f"
          done
      - name: Next.js build
        run: npm run build
