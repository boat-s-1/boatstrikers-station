name: Dev1 program isolated gate

on:
  pull_request:
    paths:
      - 'scripts/cloud-sync-offline/site-*.mjs'
      - 'scripts/cloud-sync-offline/brdb-*.mjs'
      - 'scripts/cloud-sync-offline/site-*.sql'
      - 'app/lib/racesIndexLight.js'
      - 'app/lib/boatstrikersPlatform.js'
      - 'app/races/page.js'
      - 'app/admin/program-preview/page.js'
      - 'scripts/cloud-sync-offline/site-private-preview-http-smoke.mjs'
      - '.github/workflows/dev1-program-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-program:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fixture"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: fixture
      PGUSER: postgres
      PGPASSWORD: fixture-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline program tests
        run: node --test scripts/cloud-sync-offline/*.test.mjs
      - name: Disposable PostgreSQL morning snapshot
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/cloud-sync-offline/site-race-day-morning.fixture.sql

  private-preview-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMY"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "dummy.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "dummy-project"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "dummy-project.appspot.com"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789012"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:123456789012:web:dummy"
      NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - name: Build isolated site
        run: npm run build
      - name: Admin preview HTTP smoke with synthetic data
        run: node scripts/cloud-sync-offline/site-private-preview-http-smoke.mjs
