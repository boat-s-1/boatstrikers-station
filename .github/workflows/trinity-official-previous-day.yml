name: TRINITY official previous-day collector

on:
  # GitHub schedules use UTC. These are 21:19, 22:19 and 23:09 JST.
  # Offset from the hour to reduce dropped runs under peak scheduler load.
  schedule:
    - cron: '19 12,13 * * *'
    - cron: '9 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Inspect official pages without saving predictions'
        type: boolean
        default: true
      max_races:
        description: 'Limit inspected races (1-288); omit for all races'
        type: string
        required: false
  pull_request:
    paths:
      - '.github/workflows/trinity-official-previous-day.yml'
      - 'scripts/trinity/collect-official-previous-day.mjs'
      - 'app/lib/trinityOfficialRacelist.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/trinity-official-previous-day.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check official-page reachability without credentials
        run: |
          probe_date=$(TZ=Asia/Tokyo date +%F)
          if [[ $(TZ=Asia/Tokyo date +%H) -ge 21 ]]; then
            probe_date=$(TZ=Asia/Tokyo date -d tomorrow +%F)
          fi
          node scripts/trinity/collect-official-previous-day.mjs --dry-run --probe --date "$probe_date" --max-races 3

  collect:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { course_min: 1, course_max: 6 }
          - { course_min: 7, course_max: 12 }
          - { course_min: 13, course_max: 18 }
          - { course_min: 19, course_max: 24 }
    concurrency:
      group: trinity-official-previous-day-${{ matrix.course_min }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect or submit official race lists
        env:
          COLLECTOR_SECRET: ${{ secrets.TRINITY_COLLECTOR_CRON_SECRET || secrets.HATSUNE_NEWS_CRON_SECRET }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          MANUAL_MAX_RACES: ${{ inputs.max_races }}
          COURSE_MIN: ${{ matrix.course_min }}
          COURSE_MAX: ${{ matrix.course_max }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--course-min "$COURSE_MIN" --course-max "$COURSE_MAX")
          if [[ "${{ github.event_name }}" == 'push' ]]; then
            hour=$(TZ=Asia/Tokyo date +%H)
            if (( 10#$hour < 21 || 10#$hour > 23 )); then
              echo 'Outside previous-evening window; no submission.'
              exit 0
            fi
          fi
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' && "$MANUAL_DRY_RUN" != 'false' ]]; then
            args+=(--dry-run --date "$(TZ=Asia/Tokyo date +%F)")
          fi
          if [[ -n "$MANUAL_MAX_RACES" && "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            args+=(--max-races "$MANUAL_MAX_RACES")
          fi
          if [[ " ${args[*]} " != *' --dry-run '* ]]; then
            if [[ -z "$COLLECTOR_SECRET" ]]; then
              echo 'Configure TRINITY_COLLECTOR_CRON_SECRET to match the production CRON_SECRET.' >&2
              exit 1
            fi
            export TRINITY_CRON_SECRET="$COLLECTOR_SECRET"
          fi
          node scripts/trinity/collect-official-previous-day.mjs "${args[@]}"
