name: BoatStrikers Agent Controller Offline Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated offline diagnostic
        run: node --test tools/agent-controller/offline-smoke.test.mjs
      - name: Generate synthetic report
        run: node tools/agent-controller/offline-smoke.mjs
      - name: Upload synthetic diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: agent-controller-offline-smoke
          path: offline-report/diagnostic.json
          retention-days: 3
