name: One-time race tabs patch

on:
  push:
    paths:
      - '.github/patch-race-tabs-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch RaceDetailTabs safely
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/races/components/RaceDetailTabs.js')
          text = path.read_text(encoding='utf-8')

          old_tabs = '''const TABS = [
            { key: "entries", icon: "📋", label: "出走表" },
            { key: "exhibition", icon: "⏱️", label: "展示" },
            { key: "bscExhibition", icon: "📊", label: "BSC展示" },
            { key: "raceTheater", icon: "🎬", label: "1マーク予想" },
            { key: "ai", icon: "🧠", label: "AI分析" },
            { key: "previous", icon: "📰", label: "前日版" },
            { key: "live", icon: "⚡", label: "直前版" },
            { key: "bets", icon: "🎯", label: "買い目" },
            { key: "result", icon: "🏁", label: "結果" },
          ];'''

          new_tabs = '''const TABS = [
            { key: "entries", icon: "📋", label: "出走表" },
            { key: "exhibition", icon: "⏱️", label: "展示" },
            { key: "bscExhibition", icon: "📊", label: "BS展示" },
            { key: "previous", icon: "🌙", label: "前日版" },
            { key: "live", icon: "⚡", label: "直前版" },
            { key: "previousBets", icon: "🎫", label: "前日買い目" },
            { key: "liveBets", icon: "🎯", label: "直前買い目" },
            { key: "result", icon: "🏁", label: "結果" },
          ];'''

          old_bets = '''        {activeTab === "bets" && (
                    <BetPanel
                      prediction={currentPrediction}
                      noteFeature={noteFeature}
                      result={result}
                      resultEntries={resultEntries}
                      event={event}
                    />
                  )}'''

          new_bets = '''        {activeTab === "previousBets" && (
                    <BetPanel
                      prediction={previousPrediction}
                      noteFeature={noteFeature}
                      result={result}
                      resultEntries={resultEntries}
                      event={event}
                    />
                  )}

                  {activeTab === "liveBets" && (
                    <BetPanel
                      prediction={livePrediction}
                      noteFeature={noteFeature}
                      result={result}
                      resultEntries={resultEntries}
                      event={event}
                    />
                  )}'''

          if old_tabs not in text:
              raise SystemExit('TABS block not found; aborting without changes')
          if old_bets not in text:
              raise SystemExit('bets block not found; aborting without changes')

          text = text.replace(old_tabs, new_tabs, 1).replace(old_bets, new_bets, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove one-time files
        run: |
          git config user.name "boat-s-1"
          git config user.email "marron.toyohashi@gmail.com"
          git rm .github/workflows/patch-race-tabs.yml .github/patch-race-tabs-trigger
          git add app/races/components/RaceDetailTabs.js
          git commit -m "feat(races): simplify tabs and split previous/live bets"
          git push origin main
