name: PR297 isolated verification (no production access)
on:
  push:
    branches:
      - codex/pr297-head-recheck-20261116
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr297-isolated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline regression with isolated network
        shell: bash
        run: |
          set -euo pipefail
          sudo env -i PATH=/usr/bin:/bin BATCH1_NETWORK_NAMESPACE=required unshare --net -- "$(command -v node)" scripts/batch1/offline-ci.mjs
  postgres17-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: pr297_isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pr297_isolated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check isolated PostgreSQL 17 and RLS semantics
        shell: bash
        env:
          PGPASSWORD: local_test_only
        run: |
          set -euo pipefail
          docker exec "$(docker ps -q --filter ancestor=postgres:17 | head -n 1)" psql -U postgres -d pr297_isolated -v ON_ERROR_STOP=1 <<'SQL'
          SELECT current_setting('server_version_num')::int >= 170000 AS pg17_or_newer;
          CREATE ROLE pr297_reader NOLOGIN;
          CREATE TABLE public.pr297_fixture(id integer PRIMARY KEY, value text);
          INSERT INTO public.pr297_fixture VALUES (1,'original');
          ALTER TABLE public.pr297_fixture ENABLE ROW LEVEL SECURITY;
          CREATE POLICY fixture_read ON public.pr297_fixture FOR SELECT TO pr297_reader USING (true);
          GRANT SELECT ON public.pr297_fixture TO pr297_reader;
          SET ROLE pr297_reader;
          SELECT * FROM public.pr297_fixture;
          RESET ROLE;
          BEGIN;
          REVOKE INSERT, UPDATE, DELETE ON public.pr297_fixture FROM pr297_reader;
          COMMIT;
          SELECT NOT has_table_privilege('pr297_reader','public.pr297_fixture','INSERT') AS no_insert,
                 NOT has_table_privilege('pr297_reader','public.pr297_fixture','UPDATE') AS no_update,
                 NOT has_table_privilege('pr297_reader','public.pr297_fixture','DELETE') AS no_delete;
          SQL
      - name: Execute actual S01 SQL against disposable PostgreSQL fixture
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker ps -q --filter ancestor=postgres:17 | head -n 1)"
          test -n "$container"
          docker cp ops/security/s01-bsc-results-apply.sql "$container:/tmp/pr297-apply.sql"
          docker cp tests/pr297/s01-isolated-apply.psql "$container:/tmp/pr297-fixture.psql"
          docker exec "$container" psql -U postgres -d pr297_isolated -v ON_ERROR_STOP=1 -f /tmp/pr297-fixture.psql
  postgrest-s02:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: pr297_s02
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pr297_s02"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare disposable S02 schema
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "$(docker ps -q --filter ancestor=postgres:17 | head -n 1)" psql -U postgres -d pr297_s02 -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE pr297_api NOLOGIN;
          GRANT USAGE ON SCHEMA public TO pr297_api;
          CREATE TABLE public.bs_data_lab_social_outputs (
            id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            race_date date NOT NULL UNIQUE,
            status text NOT NULL,
            generated_at timestamptz,
            updated_at timestamptz NOT NULL DEFAULT now(),
            x_post_text text
          );
          GRANT SELECT, INSERT, UPDATE, DELETE ON public.bs_data_lab_social_outputs TO pr297_api;
          GRANT USAGE, SELECT ON SEQUENCE public.bs_data_lab_social_outputs_id_seq TO pr297_api;
          SQL
      - name: Start local PostgREST (never connects to production)
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name pr297-postgrest --network host \
            -e PGRST_DB_URI="postgres://postgres:local_test_only@127.0.0.1:5432/pr297_s02" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=pr297_api \
            -e PGRST_JWT_SECRET="pr297-local-only-jwt-secret-at-least-32-characters" \
            postgrest/postgrest:v12.2.12
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs pr297-postgrest
          exit 1
      - name: Install local-only test client
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Exercise actual S02 module over local PostgREST
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { createHmac } from 'node:crypto';
          import { createClient } from '@supabase/supabase-js';
          const source = await readFile('lib/dataLabSocialClaim.js','utf8');
          const m = await import('data:text/javascript;base64,'+Buffer.from(source).toString('base64'));
          const b64 = x => Buffer.from(JSON.stringify(x)).toString('base64url');
          const payload = b64({role:'pr297_api',exp:Math.floor(Date.now()/1000)+3600});
          const head = b64({alg:'HS256',typ:'JWT'});
          const body = head+'.'+payload;
          const token = body+'.'+createHmac('sha256','pr297-local-only-jwt-secret-at-least-32-characters').update(body).digest('base64url');
          // supabase-js uses /rest/v1, while standalone PostgREST serves / directly.
          const localFetch = (input,init) => {
            const url = new URL(typeof input === 'string' ? input : input.url);
            if (url.origin !== 'http://127.0.0.1:3000' || !url.pathname.startsWith('/rest/v1/'))
              throw new Error('Blocked unexpected network request: '+url.origin+url.pathname);
            url.pathname = url.pathname.slice('/rest/v1'.length);
            return fetch(url,init);
          };
          const client = createClient('http://127.0.0.1:3000',token,{
            auth:{persistSession:false,autoRefreshToken:false},global:{fetch:localFetch}
          });
          const date1='2026-11-16';
          console.log('S02 stage: concurrent claim');
          const [a,b] = await Promise.all([m.claimDataLabGeneration(client,date1),m.claimDataLabGeneration(client,date1)]);
          assert.equal([a,b].filter(x=>x.ok).length,1,'concurrent insert must have exactly one owner');
          console.log('S02 concurrent outcomes:',JSON.stringify([a,b]));
          const winner=[a,b].find(x=>x.ok);
          console.log('S02 stage: save draft');
          const saved=await m.saveDataLabClaim(client,winner,{x_post_text:'isolated draft',updated_at:new Date().toISOString()});
          assert.equal(saved.status,'draft');
          assert.equal((await m.claimDataLabGeneration(client,date1)).ok,false);
          const date2='2026-11-17';
          const old=new Date(Date.now()-600000).toISOString();
          const {error:seedError}=await client.from(m.DATA_LAB_TABLE).insert({race_date:date2,status:'generating',updated_at:old,x_post_text:null});
          if(seedError) throw seedError;
          console.log('S02 stage: stale takeover');
          const takeover=await m.claimDataLabGeneration(client,date2);
          assert.equal(takeover.ok,true,'stale lease must be reclaimable');
          const staleSave=await m.saveDataLabClaim(client,{...takeover,updatedAt:old},{x_post_text:'stale writer'}).then(()=>false,()=>true);
          assert.equal(staleSave,true,'old owner must not save');
          await m.releaseDataLabClaim(client,takeover);
          const {data:after,error:readError}=await client.from(m.DATA_LAB_TABLE).select('status,x_post_text').eq('race_date',date2).single();
          if(readError) throw readError;
          assert.equal(after.status,'generating','failed stale takeover remains retryable after lease timeout');
          assert.equal(after.x_post_text,null);
          console.log('S02 PostgREST PASS: concurrent claim, save, stale reclaim, stale save rejected');
          console.log('S02 FIXED: failed stale takeover preserves generating status for later retry');
          JS
      - name: Verify actual PR297 S02 source equals verified candidate
        shell: bash
        run: |
          set -euo pipefail
          cmp lib/dataLabSocialClaim.js tests/pr297/dataLabSocialClaim.candidate.mjs
      - name: Compare S02 baseline and candidate against real isolated PostgREST
        shell: bash
        run: |
          set -euo pipefail
          node tests/pr297/s02-candidate-integration.mjs
      - name: Diagnostics on failure
        if: failure()
        run: docker logs pr297-postgrest || true
  next-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
      # Nonfunctional, local-only placeholders. Never use production Firebase credentials.
      NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "pr297-isolated.invalid"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "pr297-isolated-only"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "pr297-isolated-only.invalid"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
      # Syntactically valid, non-routable build-only Supabase placeholders.
      NEXT_PUBLIC_SUPABASE_URL: "https://pr297-isolated.invalid"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "pr297-isolated-build-only-not-a-real-key"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use runner Node 22+
        shell: bash
        run: node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
      - name: Install dependencies in isolated runner (no credentials)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build Next.js without deployment
        run: npm run build
