name: Phase 1 Supabase Read-only Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fixed audited migration SHA
        uses: actions/checkout@v4
        with:
          ref: 1ab230750090a02a6e5dfae376f1545978a752c6
          fetch-depth: 1

      - name: Assert checkout SHA and migration file
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1ab230750090a02a6e5dfae376f1545978a752c6"
          test -f supabase/migrations/20260917202453_restore_384_audited_ichika_historical_official_freezes.sql

      - name: Verify Production project identity (Management API GET only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Accept: application/json"             "https://api.supabase.com/v1/projects/rzosrbkyniyedolhkgxo")"
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ref")=="rzosrbkyniyedolhkgxo"; print("Production project ref verified:", d["ref"])' <<<"$response"

      - name: List applied migrations (Management API GET only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             -H "Accept: application/json"             "https://api.supabase.com/v1/projects/rzosrbkyniyedolhkgxo/database/migrations"             > /tmp/migrations.json
          python3 - <<'PY'
          import json
          target = "20260917202453"
          with open("/tmp/migrations.json", encoding="utf-8") as f:
              rows = json.load(f)
          versions = {str(row.get("version")) for row in rows}
          print("Applied migration count:", len(rows))
          print("Target migration:", target)
          print("Target applied:", target in versions)
          if target in versions:
              raise SystemExit("STOP: target migration is already applied")
          print("PASS: target migration is not applied")
          PY

      - name: Confirm read-only check completed
        run: |
          echo "Read-only Management API check completed."
          echo "No link, db push, SQL execution, migration repair, settlement, INSERT, UPDATE, or DELETE was performed."
